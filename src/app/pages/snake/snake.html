<main class="snake-page portfolio-shell">
  <header class="page-heading">
    <div class="page-eyebrow">
      <span>{{ t.snake.title }}</span>
      <span class="eyebrow-tech">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="1em"
          height="1em"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <rect x="4" y="4" width="16" height="16" rx="2" ry="2" />
          <rect x="9" y="9" width="6" height="6" />
          <line x1="9" y1="1" x2="9" y2="4" />
          <line x1="15" y1="1" x2="15" y2="4" />
          <line x1="9" y1="20" x2="9" y2="23" />
          <line x1="15" y1="20" x2="15" y2="23" />
          <line x1="20" y1="9" x2="23" y2="9" />
          <line x1="20" y1="14" x2="23" y2="14" />
          <line x1="1" y1="9" x2="4" y2="9" />
          <line x1="1" y1="14" x2="4" y2="14" />
        </svg>
        {{ t.snake.kicker }}
      </span>
    </div>
    <h1>{{ t.snake.title }}</h1>
    <p>
      {{ t.snake.description }}
    </p>
    <app-repo-button href="https://github.com/pattygcoding/Snake-WASM" />
  </header>

  <section class="snake-game-section" aria-labelledby="snake-game-title">
    <div class="snake-game-header">
      <div>
        <span class="snake-section-label">{{ t.snake.section_label }}</span>
        <h2 id="snake-game-title">{{ t.snake.game_title }}</h2>
      </div>
      <span class="snake-status" role="status">{{ status() }}</span>
    </div>

    <div class="snake-canvas-frame">
      <canvas #canvas id="glcanvas" tabindex="0" [attr.aria-label]="ariaLabel"></canvas>
    </div>

    <div class="snake-dpad" role="group" [attr.aria-label]="t.snake.controls.group">
      <button
        type="button"
        class="snake-dpad-button snake-dpad-up"
        [attr.aria-label]="t.snake.controls.up"
        (click)="onButtonClick($event, 'ArrowUp')"
        (pointerdown)="press($event, 'ArrowUp')"
        (pointerup)="release($event, 'ArrowUp')"
        (pointercancel)="release($event, 'ArrowUp')"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="1em"
          height="1em"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <line x1="12" y1="19" x2="12" y2="5" />
          <polyline points="5 12 12 5 19 12" />
        </svg>
      </button>
      <button
        type="button"
        class="snake-dpad-button snake-dpad-left"
        [attr.aria-label]="t.snake.controls.left"
        (click)="onButtonClick($event, 'ArrowLeft')"
        (pointerdown)="press($event, 'ArrowLeft')"
        (pointerup)="release($event, 'ArrowLeft')"
        (pointercancel)="release($event, 'ArrowLeft')"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="1em"
          height="1em"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <line x1="19" y1="12" x2="5" y2="12" />
          <polyline points="12 19 5 12 12 5" />
        </svg>
      </button>
      <button
        type="button"
        class="snake-dpad-button snake-dpad-right"
        [attr.aria-label]="t.snake.controls.right"
        (click)="onButtonClick($event, 'ArrowRight')"
        (pointerdown)="press($event, 'ArrowRight')"
        (pointerup)="release($event, 'ArrowRight')"
        (pointercancel)="release($event, 'ArrowRight')"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="1em"
          height="1em"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <line x1="5" y1="12" x2="19" y2="12" />
          <polyline points="12 5 19 12 12 19" />
        </svg>
      </button>
      <button
        type="button"
        class="snake-dpad-button snake-dpad-down"
        [attr.aria-label]="t.snake.controls.down"
        (click)="onButtonClick($event, 'ArrowDown')"
        (pointerdown)="press($event, 'ArrowDown')"
        (pointerup)="release($event, 'ArrowDown')"
        (pointercancel)="release($event, 'ArrowDown')"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="1em"
          height="1em"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <line x1="12" y1="5" x2="12" y2="19" />
          <polyline points="19 12 12 19 5 12" />
        </svg>
      </button>
      <span class="snake-dpad-center" aria-hidden="true"></span>
    </div>
  </section>
</main>
