<div class="flex flex-col min-h-dvh">
  <!-- Top bar: the portfolio's "PG / ..." micro label, the icon buttons and the
       game navigation.  Phones get the menu button and a left-hand drawer instead
       of the links, so the bar is always one row with no horizontal scroller. -->
  <header
    class="shrink-0 bg-ink-900/80 backdrop-blur border-b border-line/5 px-4 sm:px-5 py-3 sm:py-4 flex items-center justify-between gap-x-3 sm:justify-start sm:gap-x-7"
  >
    <div class="flex items-center gap-4 sm:gap-7 min-w-0">
      <!-- Phone menu: opens the drawer below, which carries the page links. -->
      <button
        type="button"
        class="sm:hidden shrink-0 flex items-center justify-center w-9 h-9 rounded-md bg-ink-950 border border-line/10 text-fg-muted hover:text-accent hover:border-accent/40 transition"
        [attr.aria-label]="t.app.menu.open"
        aria-controls="site-menu"
        [attr.aria-expanded]="menuOpen()"
        (click)="openMenu()"
      >
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="16"
          height="16"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
          aria-hidden="true"
        >
          <line x1="4" x2="20" y1="6" y2="6" />
          <line x1="4" x2="20" y1="12" y2="12" />
          <line x1="4" x2="20" y1="18" y2="18" />
        </svg>
      </button>
      <!-- The two icon buttons: the portfolio escape hatch and this repo.  Same
           chrome as the theme toggle, but grouped so they sit closer to each
           other than they do to the label groups. -->
      <div class="flex items-center gap-2 shrink-0">
        <!-- Escape hatch back to the portfolio. -->
        <a
          href="https://pattygcoding.com"
          target="_blank"
          rel="noopener"
          [title]="t.app.backHome.title"
          [attr.aria-label]="t.app.backHome.label"
          class="shrink-0 flex items-center justify-center w-9 h-9 rounded-md bg-ink-950 border border-line/10 text-fg-muted hover:text-accent hover:border-accent/40 transition"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="m3 9 9-7 9 7v11a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z" />
            <polyline points="9 22 9 12 15 12 15 22" />
          </svg>
        </a>
        <!-- Source for this site. -->
        <a
          href="https://github.com/pattygcoding/Arcade-PG-Website"
          target="_blank"
          rel="noopener"
          [title]="t.app.repo.title"
          [attr.aria-label]="t.app.repo.label"
          class="shrink-0 flex items-center justify-center w-9 h-9 rounded-md bg-ink-950 border border-line/10 text-fg-muted hover:text-accent hover:border-accent/40 transition"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path
              d="M15 22v-4a4.8 4.8 0 0 0-1-3.5c3 0 6-2 6-5.5.08-1.25-.27-2.48-1-3.5.28-1.15.28-2.35 0-3.5 0 0-1 0-3 1.5-2.64-.5-5.36-.5-8 0C6 2 5 2 5 2c-.3 1.15-.3 2.35 0 3.5A5.403 5.403 0 0 0 4 9c0 3.5 3 5.5 6 5.5-.39.49-.68 1.05-.85 1.65-.17.6-.22 1.23-.15 1.85v4"
            />
            <path d="M9 18c-4.51 2-5-2-7-2" />
          </svg>
        </a>
      </div>
      <a
        routerLink="/"
        class="micro text-fg-dim hover:text-accent transition shrink-0 hidden sm:inline"
        >{{ t.app.brand }}</a
      >
    </div>
    <!-- The inline links, from `sm` up.  Phones use the drawer below instead. -->
    <nav class="hidden sm:flex items-center gap-5" [attr.aria-label]="t.app.nav.label">
      <a
        routerLink="/"
        routerLinkActive="is-active"
        [routerLinkActiveOptions]="{ exact: true }"
        class="nav-link shrink-0"
        >{{ t.app.nav.home }}</a
      >
      <a routerLink="/alkalab" routerLinkActive="is-active" class="nav-link shrink-0">{{
        t.app.nav.alkalab
      }}</a>
      <a routerLink="/rustcraft" routerLinkActive="is-active" class="nav-link shrink-0">{{
        t.app.nav.rustcraft
      }}</a>
      <a routerLink="/snake" routerLinkActive="is-active" class="nav-link shrink-0">{{
        t.app.nav.snake
      }}</a>
      <a routerLink="/suprememc" routerLinkActive="is-active" class="nav-link shrink-0">{{
        t.app.nav.suprememc
      }}</a>
    </nav>
    <button
      type="button"
      [title]="t.app.theme.title"
      [attr.aria-label]="
        theme.theme() === 'dark' ? t.app.theme.toLight : t.app.theme.toDark
      "
      (click)="theme.toggle()"
      class="shrink-0 sm:ml-auto flex items-center justify-center w-9 h-9 rounded-md bg-ink-950 border border-line/10 text-fg-muted hover:text-accent hover:border-accent/40 transition"
    >
      <span class="theme-icon-sun flex" aria-hidden="true">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="16"
          height="16"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <circle cx="12" cy="12" r="4" />
          <path d="M12 2v2" />
          <path d="M12 20v2" />
          <path d="m4.93 4.93 1.41 1.41" />
          <path d="m17.66 17.66 1.41 1.41" />
          <path d="M2 12h2" />
          <path d="M20 12h2" />
          <path d="m6.34 17.66-1.41 1.41" />
          <path d="m19.07 4.93-1.41 1.41" />
        </svg>
      </span>
      <span class="theme-icon-moon flex" aria-hidden="true">
        <svg
          xmlns="http://www.w3.org/2000/svg"
          width="16"
          height="16"
          viewBox="0 0 24 24"
          fill="none"
          stroke="currentColor"
          stroke-width="2"
          stroke-linecap="round"
          stroke-linejoin="round"
        >
          <path d="M12 3a6 6 0 0 0 9 9 9 9 0 1 1-9-9Z" />
        </svg>
      </span>
    </button>
  </header>

  <!-- The phone drawer.  A sibling of the header rather than a child, because the
       header's `backdrop-blur` makes it a containing block: a fixed panel inside
       it would size to the bar instead of the viewport.  The links are repeated
       rather than reflowing the one nav so that a closed menu mounts nothing - no
       off-screen links in the tab order or the accessibility tree. -->
  @if (menuOpen()) {
    <div
      class="sm:hidden fixed inset-0 z-40 touch-none bg-ink-950/70 backdrop-blur-sm"
      (click)="closeMenu()"
      aria-hidden="true"
    ></div>
    <nav
      id="site-menu"
      class="menu-panel sm:hidden fixed inset-y-0 left-0 z-50 w-64 max-w-[80%] bg-ink-900 border-r border-line/10 px-4 py-4 flex flex-col gap-1 overflow-y-auto"
      [attr.aria-label]="t.app.nav.label"
    >
      <div class="flex items-center justify-between gap-3 mb-3">
        <span class="micro text-fg-dim">{{ t.app.brand }}</span>
        <button
          type="button"
          class="shrink-0 flex items-center justify-center w-9 h-9 rounded-md bg-ink-950 border border-line/10 text-fg-muted hover:text-accent hover:border-accent/40 transition"
          [attr.aria-label]="t.app.menu.close"
          (click)="closeMenu()"
        >
          <svg
            xmlns="http://www.w3.org/2000/svg"
            width="16"
            height="16"
            viewBox="0 0 24 24"
            fill="none"
            stroke="currentColor"
            stroke-width="2"
            stroke-linecap="round"
            stroke-linejoin="round"
            aria-hidden="true"
          >
            <path d="M18 6 6 18" />
            <path d="m6 6 12 12" />
          </svg>
        </button>
      </div>
      <a
        routerLink="/"
        routerLinkActive="is-active"
        [routerLinkActiveOptions]="{ exact: true }"
        class="menu-link"
        (click)="closeMenu()"
        >{{ t.app.nav.home }}</a
      >
      <a
        routerLink="/alkalab"
        routerLinkActive="is-active"
        class="menu-link"
        (click)="closeMenu()"
        >{{ t.app.nav.alkalab }}</a
      >
      <a
        routerLink="/rustcraft"
        routerLinkActive="is-active"
        class="menu-link"
        (click)="closeMenu()"
        >{{ t.app.nav.rustcraft }}</a
      >
      <a routerLink="/snake" routerLinkActive="is-active" class="menu-link" (click)="closeMenu()">{{
        t.app.nav.snake
      }}</a>
      <a
        routerLink="/suprememc"
        routerLinkActive="is-active"
        class="menu-link"
        (click)="closeMenu()"
        >{{ t.app.nav.suprememc }}</a
      >
    </nav>
  }

  <router-outlet />
</div>
