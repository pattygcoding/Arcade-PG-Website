name: Deploy to GitHub Pages

# Builds the arcade and publishes dist/arcade-pg-website/browser to Pages.
# `npm run build` also runs the postbuild OG step, so every route ships with its
# own link-preview tags before the artifact is uploaded.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Never let two deployments race; a newer push supersedes an in-flight run.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # Only used by the link-preview check below; the OG card images themselves
      # are committed, so the build never needs Pillow.
      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install dependencies
        run: npm ci

      - name: Unit tests
        run: npm test -- --watch=false

      - name: Build
        run: npm run build

      - name: Check link previews
        run: npm run check:previews

      # enablement lets the first run turn Pages on by itself, so the repository
      # does not need the setting flipped by hand.
      - uses: actions/configure-pages@v5
        with:
          enablement: true

      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist/arcade-pg-website/browser

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
