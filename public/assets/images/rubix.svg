<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1024 1024" width="1024" height="1024" role="img" aria-labelledby="rubix-logo-title">
	<title id="rubix-logo-title">Rubik's Cube Solver</title>
	<!--
		The project mark: an isometric cube whose stickers are the pattygcoding.com
		mint ramp on the navy canvas the portfolio uses (#a5edcf / #6fd9af / #3f9c7b
		on #06090e), so the same file works as the site's favicon and as the
		portfolio card art. Three faces share one unit-square face definition, placed
		by an isometric matrix each, so the geometry is exact rather than eyeballed.
	-->
	<defs>
		<radialGradient id="rubix-logo-glow" cx="50%" cy="40%" r="58%">
			<stop offset="0" stop-color="#a5edcf" stop-opacity="0.18" />
			<stop offset="1" stop-color="#a5edcf" stop-opacity="0" />
		</radialGradient>
		<!-- One face of the cube, in unit space: the plastic frame the stickers sit on. -->
		<rect id="rubix-logo-frame" width="1" height="1" rx="0.05" />
		<!-- The nine stickers of a face, inset so the frame shows as the cube's grid. -->
		<g id="rubix-logo-stickers">
			<rect x="0.022" y="0.022" width="0.2893" height="0.2893" rx="0.028" />
			<rect x="0.3553" y="0.022" width="0.2893" height="0.2893" rx="0.028" />
			<rect x="0.6887" y="0.022" width="0.2893" height="0.2893" rx="0.028" />
			<rect x="0.022" y="0.3553" width="0.2893" height="0.2893" rx="0.028" />
			<rect x="0.3553" y="0.3553" width="0.2893" height="0.2893" rx="0.028" />
			<rect x="0.6887" y="0.3553" width="0.2893" height="0.2893" rx="0.028" />
			<rect x="0.022" y="0.6887" width="0.2893" height="0.2893" rx="0.028" />
			<rect x="0.3553" y="0.6887" width="0.2893" height="0.2893" rx="0.028" />
			<rect x="0.6887" y="0.6887" width="0.2893" height="0.2893" rx="0.028" />
		</g>
	</defs>
	<rect width="1024" height="1024" rx="180" fill="#06090e" />
	<rect x="4" y="4" width="1016" height="1016" rx="176" fill="none" stroke="#16202b" stroke-width="8" />
	<rect width="1024" height="1024" rx="180" fill="url(#rubix-logo-glow)" />
	<!-- The cube's frame, one isometric matrix per face: top, right, left. -->
	<use href="#rubix-logo-frame" transform="matrix(303.109 175 -303.109 175 512 162)" fill="#0e1f1c" />
	<use href="#rubix-logo-frame" transform="matrix(-303.109 175 0 350 815.109 337)" fill="#0e1f1c" />
	<use href="#rubix-logo-frame" transform="matrix(303.109 175 0 350 208.891 337)" fill="#0e1f1c" />
	<!-- The stickers: lit from above, so the top face is brightest and the left deepest. -->
	<use href="#rubix-logo-stickers" transform="matrix(303.109 175 -303.109 175 512 162)" fill="#a5edcf" />
	<use href="#rubix-logo-stickers" transform="matrix(-303.109 175 0 350 815.109 337)" fill="#6fd9af" />
	<use href="#rubix-logo-stickers" transform="matrix(303.109 175 0 350 208.891 337)" fill="#3f9c7b" />
</svg>